<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9f3" />
    <meta name="description" content="Your boring boy made something for you." />
    <!-- Shared privately: ask search engines not to index this page. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>A little date, just for you</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23703d4b' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      If the app can't start, say so kindly instead of leaving a blank page. On your own computer (VS Code's
      "Go Live", a double-clicked index.html) it explains how to preview it; anywhere else — e.g. a host that
      published the source instead of the build — visitors just see a gentle "getting ready" note.
      On a correctly deployed site the app is up long before this runs.
    -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.childElementCount) return
          var onThisComputer = location.protocol === 'file:' || /^(localhost|127\.|\[::1\]|0\.0\.0\.0)/.test(location.hostname)
          var help = onThisComputer
            ? '<p style="margin:0;font:14px/1.7 system-ui,sans-serif;color:#6e5a5f">VS Code&rsquo;s &ldquo;Go Live&rdquo; and double-clicking ' +
              '<code>index.html</code> can&rsquo;t run it. Open a terminal in the project, run <code style="background:#f6dce2;padding:2px 6px;border-radius:6px">npm run dev</code> ' +
              'and open <a style="color:#703d4b" href="http://localhost:5173/">http://localhost:5173/</a></p>'
            : '<p style="margin:0;color:#6e5a5f">Please check back in a few minutes &#9825;</p>'
          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff9f3;color:#47363a;font:17px/1.6 Georgia,serif;text-align:center">' +
            '<div style="max-width:30rem"><div style="font-size:42px;line-height:1;color:#703d4b">&#9825;</div>' +
            '<h1 style="margin:14px 0 10px;font-weight:400;font-size:30px;color:#703d4b">Almost there&hellip;</h1>' +
            '<p style="margin:0 0 18px">This little page is still getting ready.</p>' +
            help +
            '</div></div>'
        }, 2500)
      })
    </script>
  </body>
</html>
